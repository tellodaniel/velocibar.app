<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="VelociBar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1820"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dd4db"/>
      <stop offset="1" stop-color="#38bdc3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- speedometer arc -->
  <path d="M16 40 A18 18 0 1 1 48 40" fill="none" stroke="#1c2c38" stroke-width="5" stroke-linecap="round"/>
  <path d="M16 40 A18 18 0 0 1 30 22.7" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
  <!-- bullseye / signal dot -->
  <circle cx="32" cy="34" r="9.5" fill="none" stroke="url(#ring)" stroke-width="3.2"/>
  <circle cx="32" cy="34" r="3.6" fill="#4dd4db"/>
</svg>
